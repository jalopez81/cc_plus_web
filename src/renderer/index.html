<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; media-src 'self' blob: mediastream:"
    />
    <title>LCP - Live Caption Plus</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay" id="overlay">
      <header class="toolbar">
        <div class="toolbar-row titlebar">
          <div class="brand-mark window-controls">
            <button type="button" id="winClose" title="Close" aria-label="Close"></button>
            <button type="button" id="winMinimize" title="Minimize" aria-label="Minimize"></button>
            <button type="button" id="winCollapse" title="Collapse" aria-label="Collapse" aria-pressed="false"></button>
          </div>
          <nav class="app-menu" aria-label="Application menu">
            <button type="button" data-menu="file">File</button>
            <button type="button" data-menu="edit">Edit</button>
            <button type="button" data-menu="view">View</button>
            <button type="button" id="updateBtn" title="Download the latest version">Actualizar</button>
          </nav>
          <div class="status">
            <span class="dot" id="statusDot" role="status" aria-label="Idle" title="Idle"></span>
            <span class="hold-timer" id="holdTimer" title="Hold time: resets on every new message">15:00</span>
            <span class="mic-indicator" id="micIndicator" role="img" data-state="unknown" title="Headset mic" aria-label="Headset mic status">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5" /><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5" /><path class="slash" d="M2.5 2.5l11 11" /></svg>
              <span class="mic-label" id="micLabel">MIC</span>
            </span>
            <button type="button" class="speak-indicator" id="speakIndicator" title="Transcription on: click to mute" aria-label="Mute transcription" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3H2.5z" /><path class="waves" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4" /><path class="cross" d="M11 6l3.5 4M14.5 6L11 10" /></svg>
              <span id="speakLabel">ON</span>
            </button>
          </div>
          <div class="controls">
            <button id="toggleBtn" class="primary start" data-state="idle" title="Capture system audio">Start</button>
          </div>
        </div>
      </header>
      <div class="accent-stripe" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

      <section class="settings" id="settings" aria-label="Configuración">
        <button class="cfgbar" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsContent">
          <span class="cfg-label">ENGINES</span>
          <span class="cfg-summary" id="settingsSummary">Whisper · Off</span>
          <span class="cfg-chevron" aria-hidden="true">▾</span>
        </button>
        <div class="settings-content" id="settingsContent" aria-hidden="true">
          <form id="settingsForm" novalidate inert>
            <div class="engine-row">
              <label class="engine-select-label">
                <span class="sr-only">Transcription engine</span>
                <select name="transcriptionEngine" aria-label="Transcription engine">
                  <option value="whisper">Whisper</option>
                  <option value="deepgram">Deepgram</option>
                </select>
              </label>
              <label class="engine-input-label" data-engine-for="whisper">
                <span class="sr-only">Transcription WebSocket URL</span>
                <input type="url" name="transcriptionUrl" autocomplete="off" placeholder="wss://.../ws/transcribe" />
              </label>
              <label class="engine-input-label access-code-label" data-engine-for="whisper">
                <span class="sr-only">Access code</span>
                <input type="password" name="accessCode" autocomplete="off" placeholder="Access code" />
              </label>
              <label class="engine-input-label" data-engine-for="deepgram">
                <span class="sr-only">Deepgram API key</span>
                <input type="password" name="deepgramKey" autocomplete="off" placeholder="Deepgram API key" />
              </label>
            </div>
            <div class="engine-row">
              <label class="engine-select-label">
                <span class="sr-only">Translation engine</span>
                <select name="translator">
                  <option value="auto">Auto</option>
                  <option value="deepl">DeepL</option>
                  <option value="google">Google</option>
                  <option value="mymemory">MyMemory</option>
                  <option value="apertium">Apertium</option>
                  <option value="off">Off</option>
                </select>
              </label>
              <label class="engine-input-label" data-for="deepl">
                <span class="sr-only">DeepL API key</span>
                <input type="password" name="deeplKey" autocomplete="off" placeholder="DeepL API key" />
              </label>
              <label class="engine-input-label" data-for="mymemory auto">
                <span class="sr-only">MyMemory email (optional)</span>
                <input type="email" name="myMemoryEmail" autocomplete="off" placeholder="MyMemory email (optional)" />
              </label>
            </div>
            <div class="settings-actions">
              <button type="submit" class="primary">Done</button>
            </div>
          </form>
        </div>
      </section>

      <section class="call-tools" aria-label="Notas de la llamada">
        <label class="sr-only" for="callNotes">Notas rápidas</label>
        <textarea id="callNotes" rows="1" spellcheck="true" placeholder="Notas rápidas de la llamada…"></textarea>
        <div class="notes-actions">
          <button type="button" class="icon-btn" id="copyNotes" title="Copiar notas" aria-label="Copiar notas">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" /><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" /></svg>
          </button>
          <button type="button" class="icon-btn" id="clearNotes" title="Limpiar notas" aria-label="Limpiar notas">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M6.5 4.5V3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v1.5M4 4.5l.6 8.1a1 1 0 0 0 1 .9h4.8a1 1 0 0 0 1-.9l.6-8.1" /></svg>
          </button>
        </div>
        <span class="sr-only" id="notesSaveStatus" role="status">Guardado automáticamente</span>
      </section>

      <main class="captions" id="captions">
        <p class="placeholder" id="placeholder">
          Presiona <strong>Iniciar</strong> para transcribir el audio del sistema.
        </p>
      </main>

      <nav class="interpreter-tools" aria-label="Herramientas de interpretación">
        <button type="button" data-category="Saludos y cierres">Saludos</button>
        <button type="button" data-category="Intervenciones y espera">Intervenciones</button>
        <button type="button" data-category="Solicitudes y cierres">Solicitudes</button>
      </nav>

      <section class="tool-popover soundbyte-popover" id="soundbytePopup" hidden aria-label="Frases rápidas">
        <header class="popover-header">
          <div>
            <span class="tool-label">FRASES RÁPIDAS</span>
            <h2 id="soundbyteHeading">Saludos</h2>
          </div>
          <button type="button" class="popover-close" data-close-popover aria-label="Cerrar">✕</button>
        </header>
        <div class="interpreter-profile">
          <label>Nombre
            <input id="interpreterName" type="text" autocomplete="name" placeholder="Tu nombre" />
          </label>
          <label>ID de intérprete
            <input id="interpreterId" type="text" placeholder="Tu ID" />
          </label>
        </div>
        <label class="soundbyte-search">
          <span class="sr-only">Buscar frase</span>
          <input id="soundbyteSearch" type="search" placeholder="Buscar frase…" />
        </label>
        <div class="soundbyte-list" id="soundbyteList" aria-live="polite"></div>
        <p class="popover-empty" id="soundbyteEmpty" hidden>No hay frases en esta categoría.</p>
        <footer class="popover-footer">
          <button type="button" id="addSoundbyte">＋ Agregar</button>
        </footer>
      </section>

      <dialog id="soundbyteDialog">
        <form id="soundbyteForm">
          <header class="popover-header">
            <div>
              <span class="tool-label">BIBLIOTECA PERSONAL</span>
              <h2 id="soundbyteDialogTitle">Agregar frase</h2>
            </div>
            <button type="button" class="popover-close" id="closeSoundbyteDialog" aria-label="Cerrar">✕</button>
          </header>
          <label>Título
            <input id="soundbyteTitle" type="text" required maxlength="80" />
          </label>
          <label>Categoría
            <select id="soundbyteCategory">
              <option>Saludos y cierres</option>
              <option>Intervenciones y espera</option>
              <option>Solicitudes y cierres</option>
            </select>
          </label>
          <label>Idioma
            <select id="soundbyteLanguage">
              <option value="EN">English</option>
              <option value="ES">Español</option>
              <option value="BILINGUAL">Bilingüe</option>
            </select>
          </label>
          <label>Color de fondo
            <input id="soundbyteBackgroundColor" class="soundbyte-color-input" type="color" value="#252832" />
          </label>
          <label>Frase
            <textarea id="soundbyteText" required rows="4"></textarea>
          </label>
          <footer class="dialog-actions">
            <button type="button" id="cancelSoundbyte">Cancelar</button>
            <button type="submit" class="primary">Guardar frase</button>
          </footer>
        </form>
      </dialog>

      <div class="tool-toast" id="toolToast" role="status" aria-live="polite"></div>

      <footer class="bottom-toolbar" aria-label="Transcript controls">
        <label class="background-picker" title="Choose background color" aria-label="Choose background color">
          <input type="color" id="bgColorInput" />
        </label>
        <label class="visibility-toggle">
          <input type="checkbox" id="showTranscriptionToggle" />
          <span class="checkmark" aria-hidden="true"></span>
          <span>Transcription</span>
        </label>
        <label class="visibility-toggle">
          <input type="checkbox" id="showTranslationToggle" />
          <span class="checkmark" aria-hidden="true"></span>
          <span>Translation</span>
        </label>
        <label class="visibility-toggle" title="One sentence per line, or normal paragraphs">
          <input type="checkbox" id="sentenceLinesToggle" />
          <span class="checkmark" aria-hidden="true"></span>
          <span>Lines</span>
        </label>
        <span class="toolbar-spacer"></span>
        <button id="fontDownBtn" title="Smaller text" aria-label="Smaller text">−</button>
        <output class="font-size-value" id="fontSizeValue" title="Text size" aria-live="polite">26</output>
        <button id="fontUpBtn" title="Larger text" aria-label="Larger text">+</button>
        <button id="newCallBtn" class="new-call-btn" title="Mark a new call in the log" aria-label="New call">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 2.5H3.6a1 1 0 0 0-1 1.1c.5 5.1 4.6 9.2 9.7 9.7a1 1 0 0 0 1.1-1v-1.6a1 1 0 0 0-.8-1l-1.9-.4a1 1 0 0 0-1 .3l-.6.7a7.6 7.6 0 0 1-3-3l.7-.6a1 1 0 0 0 .3-1l-.4-1.9a1 1 0 0 0-1-.8z" /><path d="M11.5 1.5v4M9.5 3.5h4" /></svg>
          <span>New call</span>
        </button>
        <button id="clearBtn" class="clear-btn" title="Clear captions" aria-label="Clear captions">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 2 8.6 7.4" /><path d="M7.6 6.6l1.8 1.8" /><path d="M7.4 8.6c-1.5-.6-3.1.2-3.4 1.8-.2 1.2-.7 2-1.5 2.5 2 .7 4.6.3 5.5-1.3.5-.9.4-2-.6-3z" /></svg>
          <span>Clear</span>
        </button>
      </footer>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
