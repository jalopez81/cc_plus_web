<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src wss://api.deepgram.com; media-src 'self' blob: mediastream:"
    />
    <title>LCP - Live Caption Plus</title>
    <link rel="icon" href="../../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay" id="overlay">
      <main class="captions" id="captions">
        <p class="placeholder" id="placeholder">
          Presiona <strong>Iniciar</strong> para transcribir el audio del sistema.
        </p>
      </main>

      <header class="toolbar">
        <div class="toolbar-row">
          <div class="status">
            <span class="hold-timer" id="holdTimer" title="Hold time: resets on every new message">15:00</span>
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Idle</span>
          </div>
          <div class="controls">
            <select id="sourceMode" title="Source language">
              <option value="auto">Auto EN ⇄ ES</option>
              <option value="en">English → Español</option>
              <option value="es">Español → English</option>
            </select>
            <select id="translatorSelect" title="Translation service">
              <option value="auto">Auto</option>
              <option value="deepl">DeepL</option>
              <option value="google">Google</option>
              <option value="mymemory">MyMemory</option>
              <option value="apertium">Apertium</option>
              <option value="off">No translation</option>
            </select>
            <button id="toggleBtn" class="primary" title="Capture system audio">Start</button>
            <button id="clearBtn" title="Clear captions">Clear</button>
            <button id="fontDownBtn" title="Smaller text">A−</button>
            <button id="fontUpBtn" title="Larger text">A+</button>
            <button id="clickThroughBtn">Pin</button>
            <button id="settingsBtn" title="Settings">⚙</button>
            <button id="collapseBtn" title="Collapse">▼</button>
            <button id="closeBtn" title="Quit">✕</button>
          </div>
        </div>
        <div class="toolbar-row appearance-row">
          <div class="appearance">
            <label class="background-picker" title="Choose the window background color">
              <span aria-hidden="true">BG</span>
              <input type="color" id="bgColorInput" />
            </label>
            <button id="randomizeBgBtn" title="Choose a random dark background color">Random dark BG</button>
            <label title="Background opacity (0% is fully transparent)">
              Opacity
              <input type="range" id="bgOpacityInput" min="0" max="1" step="0.02" />
              <output id="bgOpacityValue"></output>
            </label>
          </div>
        </div>
      </header>

      <nav class="interpreter-tools" aria-label="Herramientas de interpretación">
        <span class="tool-label">FRASES</span>
        <button type="button" data-category="Saludos y cierres">Saludos</button>
        <button type="button" data-category="Intervenciones y espera">Intervenciones</button>
        <button type="button" data-category="Solicitudes y cierres">Solicitudes</button>
      </nav>

      <section class="tool-popover soundbyte-popover" id="soundbytePopup" hidden aria-label="Frases rápidas">
        <header class="popover-header">
          <div>
            <span class="tool-label">FRASES RÁPIDAS</span>
            <h2 id="soundbyteHeading">Saludos</h2>
          </div>
          <button type="button" class="popover-close" data-close-popover aria-label="Cerrar">✕</button>
        </header>
        <label class="soundbyte-search">
          <span class="sr-only">Buscar frase</span>
          <input id="soundbyteSearch" type="search" placeholder="Buscar frase…" />
        </label>
        <div class="soundbyte-list" id="soundbyteList" aria-live="polite"></div>
        <p class="popover-empty" id="soundbyteEmpty" hidden>No hay frases en esta categoría.</p>
        <footer class="popover-footer">
          <button type="button" id="addSoundbyte">＋ Agregar</button>
          <button type="button" id="restoreSoundbytes">Restaurar iniciales</button>
        </footer>
      </section>

      <section class="call-tools" aria-label="Datos del intérprete y notas">
        <div class="interpreter-profile">
          <label>Nombre
            <input id="interpreterName" type="text" autocomplete="name" placeholder="Tu nombre" />
          </label>
          <label>ID de intérprete
            <input id="interpreterId" type="text" placeholder="Tu ID" />
          </label>
        </div>
        <div class="call-notes-row">
          <label class="sr-only" for="callNotes">Notas rápidas</label>
          <textarea id="callNotes" spellcheck="true" placeholder="Notas rápidas de la llamada…"></textarea>
          <div class="notes-actions">
          <div class="font-controls">
            <button type="button" id="notesFontDown" aria-label="Reducir texto">A−</button>
            <output id="notesFontSize">16 px</output>
            <button type="button" id="notesFontUp" aria-label="Aumentar texto">A+</button>
          </div>
          <button type="button" id="copyNotes">Copiar</button>
          <button type="button" id="clearNotes">Limpiar</button>
          </div>
        </div>
        <p class="autosave-note" id="notesSaveStatus" role="status">Guardado automáticamente</p>
      </section>

      <dialog id="soundbyteDialog">
        <form id="soundbyteForm">
          <header class="popover-header">
            <div>
              <span class="tool-label">BIBLIOTECA PERSONAL</span>
              <h2 id="soundbyteDialogTitle">Agregar frase</h2>
            </div>
            <button type="button" class="popover-close" id="closeSoundbyteDialog" aria-label="Cerrar">✕</button>
          </header>
          <label>Título
            <input id="soundbyteTitle" type="text" required maxlength="80" />
          </label>
          <label>Categoría
            <select id="soundbyteCategory">
              <option>Saludos y cierres</option>
              <option>Intervenciones y espera</option>
              <option>Solicitudes y cierres</option>
            </select>
          </label>
          <label>Idioma
            <select id="soundbyteLanguage">
              <option value="EN">English</option>
              <option value="ES">Español</option>
              <option value="BILINGUAL">Bilingüe</option>
            </select>
          </label>
          <label>Color de fondo
            <input id="soundbyteBackgroundColor" class="soundbyte-color-input" type="color" value="#252832" />
          </label>
          <label>Frase
            <textarea id="soundbyteText" required rows="4"></textarea>
          </label>
          <footer class="dialog-actions">
            <button type="button" id="cancelSoundbyte">Cancelar</button>
            <button type="submit" class="primary">Guardar frase</button>
          </footer>
        </form>
      </dialog>

      <div class="tool-toast" id="toolToast" role="status" aria-live="polite"></div>

      <section class="settings" id="settings" hidden>
        <form id="settingsForm">
          <label>
            Deepgram API key
            <input type="password" name="deepgramKey" autocomplete="off" placeholder="Required for transcription" />
          </label>
          <label>
            Translator
            <select name="translator">
              <option value="auto">Auto (try each service until one works)</option>
              <option value="deepl">DeepL (free API key)</option>
              <option value="google">Google (free, no key)</option>
              <option value="mymemory">MyMemory (free, no key)</option>
              <option value="apertium">Apertium (free, no key, lower quality)</option>
              <option value="off">Off (transcribe only)</option>
            </select>
          </label>
          <label data-for="mymemory auto">
            MyMemory email (optional, raises free quota)
            <input type="email" name="myMemoryEmail" autocomplete="off" />
          </label>
          <label data-for="deepl auto">
            DeepL API key (Auto tries DeepL first when set)
            <input type="password" name="deeplKey" autocomplete="off" />
          </label>
          <div class="row">
            <label>
              Font size
              <input type="range" name="fontSize" min="16" max="48" step="1" />
            </label>
            <label>
              Background opacity
              <input type="range" name="bgOpacity" min="0" max="1" step="0.02" />
            </label>
            <label>
              Background color
              <input type="color" name="bgColor" />
            </label>
          </div>
          <label class="checkbox">
            <input type="checkbox" name="showOriginal" /> Show original transcript above translation
          </label>
          <div class="actions">
            <button type="submit" class="primary">Done</button>
          </div>
        </form>
      </section>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
